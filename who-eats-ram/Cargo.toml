[package]
name = "who-eats-ram"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.11"
raw-window-handle = "0.6"
sysinfo = "0.40.4"
tray-icon = "0.27"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
